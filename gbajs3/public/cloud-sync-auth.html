<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; connect-src https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Connect Google Drive</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #121821;
        color: #f4f7fb;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
      }

      main {
        width: min(24rem, calc(100vw - 2rem));
        padding: 1.5rem;
        background: #1a2330;
        border: 1px solid #334155;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 0.35);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }

      p {
        margin: 0 0 1rem;
        color: #cbd5e1;
        line-height: 1.5;
      }

      button {
        width: 100%;
        min-height: 2.75rem;
        border: 0;
        border-radius: 0.625rem;
        color: #0f172a;
        background: #f8fafc;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #status {
        min-height: 1.25rem;
        margin-top: 1rem;
        color: #fca5a5;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect Google Drive</h1>
      <p>
        This authorizes gbajs3 to use its private app data folder in your Google
        Drive. No Drive token is saved by this page.
      </p>
      <button id="connect" type="button">Continue with Google Drive</button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const clientId = params.get('client_id');
      const state = params.get('state');
      const channelName = 'gbajs3-cloud-sync-auth';
      const driveAppDataScope = 'https://www.googleapis.com/auth/drive.appdata';
      const button = document.getElementById('connect');
      const status = document.getElementById('status');
      const channel =
        'BroadcastChannel' in window ? new BroadcastChannel(channelName) : null;

      const postAndClose = (message) => {
        channel?.postMessage({ ...message, state });
        channel?.close();
        window.setTimeout(() => window.close(), 250);
      };

      const setError = (message) => {
        status.textContent = message;
        button.disabled = false;
      };

      if (!clientId || !state) {
        setError('Google Drive connection is missing required state.');
      } else if (!channel) {
        setError('This browser does not support secure auth handoff.');
      } else {
        button.addEventListener('click', () => {
          button.disabled = true;
          status.textContent = 'Waiting for Google...';

          if (!window.google?.accounts?.oauth2) {
            setError('Google authorization is still loading. Try again.');
            return;
          }

          const tokenClient = window.google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: driveAppDataScope,
            callback: (response) => {
              if (response.error) {
                postAndClose({
                  type: 'error',
                  error:
                    response.error_description ||
                    response.error ||
                    'Google Drive authorization failed'
                });
                return;
              }

              postAndClose({
                type: 'success',
                accessToken: response.access_token,
                expiresIn: response.expires_in,
                scope: response.scope
              });
            },
            error_callback: (error) => {
              postAndClose({
                type: 'error',
                error: `Google Drive authorization failed: ${error.type}`
              });
            }
          });

          tokenClient.requestAccessToken();
        });
      }
    </script>
  </body>
</html>
